[versions]
spring-version = "7.0.10"
spring-boot-version = "4.1.1"
spring-boot-core-version = "1.0.0"
junit-version = "6.1.3"
dotenv-version = "5.1.0"
postgres-version = "42.7.10"

[libraries]
spring-boot-starter-ms = { group = "com.mj.spring.boot", name = "spring-boot-starter-microservice", version.ref = "spring-boot-core-version" }

# spring 7 dependencies
spring-transaction = { group = "org.springframework", name = "spring-tx", version.ref = "spring-version" }

# spring boot 4 dependencies
spring-boot-auto = { group = "org.springframework.boot", name = "spring-boot-autoconfigure", version.ref = "spring-boot-version" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "spring-boot-version" }

# spring boot 4 starter dependencies
spring-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter", version.ref = "spring-boot-version" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "spring-boot-version" }
spring-boot-starter-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-jdbc", version.ref = "spring-boot-version" }
spring-boot-starter-jdbc-test = { group = "org.springframework.boot", name = "spring-boot-starter-jdbc-test", version.ref = "spring-boot-version" }
spring-boot-starter-data-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-data-jdbc", version.ref = "spring-boot-version" }
spring-boot-starter-data-jdbc-test = { group = "org.springframework.boot", name = "spring-boot-starter-data-jdbc-test", version.ref = "spring-boot-version" }
spring-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa", version.ref = "spring-boot-version" }
spring-boot-starter-data-jpa-test = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa-test", version.ref = "spring-boot-version" }
spring-boot-starter-webmvc = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc", version.ref = "spring-boot-version" }
spring-boot-starter-webmvc-test = { group = "org.springframework.boot", name = "spring-boot-starter-webmvc-test", version.ref = "spring-boot-version" }
spring-boot-starter-security = { group = "org.springframework.boot", name = "spring-boot-starter-security", version.ref = "spring-boot-version" }
spring-boot-starter-security-test = { group = "org.springframework.boot", name = "spring-boot-starter-security-test", version.ref = "spring-boot-version" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation", version.ref = "spring-boot-version" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator", version.ref = "spring-boot-version" }
spring-boot-starter-actuator-test = { group = "org.springframework.boot", name = "spring-boot-starter-actuator-test", version.ref = "spring-boot-version" }

# junit dependencies
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-version" }
junit = { module = "org.junit.jupiter:junit-jupiter" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# dotenv dependencies
dotenv-bom = { group = "me.paulschwarz", name = "spring-dotenv-bom", version.ref = "dotenv-version" }
dotenv = { module = "me.paulschwarz:springboot4-dotenv" }

# database drivers dependencies
postgres-database-driver = { module = "org.postgresql:postgresql", version.ref = "postgres-version" }