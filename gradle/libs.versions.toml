[versions]
spring-boot-starter-version = "4.1.1"
junit-version = "6.1.3"

[libraries]
sprint-boot-starter = {group = "org.springframework.boot", name = "spring-boot-starter", version = "spring-boot-starter-version"}
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web", version = "spring-boot-starter-version" }

junit = {group = "org.junit.jupiter", name = "junit-jupiter", version = "junit-version"}
junit-params = {module = "org.junit.jupiter:junit-jupiter-params", version = "junit-version"}