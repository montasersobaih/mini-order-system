[versions]
starter-version = "4.1.1"
junit-version = "6.1.3"
postgres-version = "42.7.10"

[libraries]
# spring boot starter dependencies
sprint-boot-starter = { group = "org.springframework.boot", name = "spring-boot-starter", version.ref = "starter-version" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test", version.ref = "starter-version" }
spring-boot-starter-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-jdbc", version.ref = "starter-version" }
spring-boot-starter-data-jdbc = { group = "org.springframework.boot", name = "spring-boot-starter-data-jdbc", version.ref = "starter-version" }
spring-boot-starter-data-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa", version.ref = "starter-version" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web", version.ref = "starter-version" }
spring-boot-starter-security = { group = "org.springframework.boot", name = "spring-boot-starter-security", version.ref = "starter-version" }
sprint-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation", version.ref = "starter-version" }

# spring boot dependencies
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "starter-version" }

# junit dependencies
junit-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit-version" }
junit = { module = "org.junit.jupiter:junit-jupiter" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

# database drivers dependencies
postgres-database-driver = { module = "org.postgresql:postgresql", version.ref = "postgres-version" }