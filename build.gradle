allprojects {
    group = 'com.mj.miniordersystem'
    // version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        mavenLocal()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        testImplementation libs.spring.boot.starter.test
    }

    test {
        useJUnitPlatform()
    }
}
